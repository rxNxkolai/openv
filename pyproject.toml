[project]
name = "patron"
version = "0.1.0"
description = "Agentic shopper-behavior intelligence on existing store cameras"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "rfdetr>=1.2.0",
    "supervision>=0.26.0",
    "opencv-python>=4.10",
    "numpy>=1.26,<3",
    "trackers>=2.5.0.post0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
]

[project.scripts]
patron = "patron.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patron"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
